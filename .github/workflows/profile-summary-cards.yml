name: GitHub Profile Summary Cards

on:
  schedule:
    - cron: "0 0 * * *" # daily
  workflow_dispatch: # allows a manual run from the Actions tab

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    name: Generate cards
    steps:
      - uses: vn7n24fzkq/github-profile-summary-cards@release/v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          UTC_OFFSET: 6 # Bangladesh (UTC+6), used for the productive-time card
